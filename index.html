        // =====================================================================
        // 4. UTILITAS UI (TOAST, MODAL, LOADER, ESCAPE HTML)
        // =====================================================================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function refreshIcons() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function hideLoader() {
            const loader = document.getElementById('app-loader');
            if (!loader || loader.classList.contains('hidden')) return;
            loader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loader.classList.add('hidden'), 300);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const styles = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-500',
                info: 'bg-slate-900 text-white border-slate-700'
            };
            const icons = {
                success: 'check-circle-2',
                error: 'alert-circle',
                info: 'info'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-xs sm:text-sm font-medium fade-in ${styles[type] || styles.info}`;
            toast.innerHTML = `
                <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
            `;
            container.appendChild(toast);
            refreshIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function openModal(html) {
            const root = document.getElementById('modal-root');
            const content = document.getElementById('modal-content');
            if (!root || !content) return;
            content.innerHTML = html;
            root.classList.remove('hidden');
            root.classList.add('flex');
            refreshIcons();
        }

        function closeModal() {
            const root = document.getElementById('modal-root');
            if (!root) return;
            root.classList.add('hidden');
            root.classList.remove('flex');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch {
                return dateStr;
            }
        }

            }
            if (role === 'guru_bk') {

                'Disetujui': 'bg-indigo-100 text-indigo-800 border-indigo-200',

        // =====================================================================
        // 5. INISIALISASI FIREBASE & LISTENER REAL-TIME (TANPA SEED DATA)
        // =====================================================================
        async function initFirebaseAndData() {
            // Pengaman agar layar loading tidak pernah stuck melebihi 5 detik
            const safetyTimer = setTimeout(() => {
                hideLoader();
                render();
            }, 5000);

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                useFirebase = true;
                state.isFirebaseConnected = true;

                setupRealtimeListeners();
            } catch (err) {
                console.error('Gagal menghubungkan ke Firebase, beralih ke mode memori lokal:', err);
                useFirebase = false;
                state.isFirebaseConnected = false;
                showToast('Koneksi Firebase gagal. Aplikasi berjalan dalam mode memori lokal sementara.', 'error');
            } finally {
                clearTimeout(safetyTimer);
                hideLoader();
                render();
            }
        }

        function setupRealtimeListeners() {
            if (!db) return;

            // Listener Koleksi: users
            onSnapshot(collection(db, 'users'), (snap) => {
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                state.users = list;

                // Sinkronkan data sesi aktif jika user sedang login
                if (state.currentUser) {
                    const updated = list.find(u => u.id === state.currentUser.id);
                    if (updated) {
                        state.currentUser = updated;
                    }
                }
                render();
            }, (err) => console.error('Listener users error:', err));

            // Listener Koleksi: counselings
            onSnapshot(collection(db, 'counselings'), (snap) => {
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                state.counselings = list;
                render();
            }, (err) => console.error('Listener counselings error:', err));

            // Listener Koleksi: careers
            onSnapshot(collection(db, 'careers'), (snap) => {
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                state.careers = list;
                render();
            }, (err) => console.error('Listener careers error:', err));

            // Listener Dokumen Pengaturan: settings/config (hanya baca, tidak menulis otomatis)
            onSnapshot(doc(db, 'settings', 'config'), (docSnap) => {
                if (docSnap.exists() && docSnap.data().guruBkCode) {
                    state.guruBkCode = String(docSnap.data().guruBkCode).toUpperCase();
                } else {
                    state.guruBkCode = DEFAULT_GURU_CODE;
                }
                render();
            }, (err) => console.error('Listener settings error:', err));
        }

        // =====================================================================
        // 6. OPERASI CRUD FIRESTORE (DENGAN FALLBACK LOKAL AMAN)
        // =====================================================================
        async function dbCreateUser(payload) {
            const data = {
                ...payload,
                createdAt: new Date().toISOString()
            };
            if (useFirebase && db) {
                const ref = await addDoc(collection(db, 'users'), data);
                return { id: ref.id, ...data };
            }
            const localItem = { id: 'usr-' + Date.now(), ...data };
            state.users.unshift(localItem);
            render();
            return localItem;
        }

        async function dbUpdateUser(userId, updates) {
            if (useFirebase && db) {
                await updateDoc(doc(db, 'users', userId), updates);
            } else {
                const idx = state.users.findIndex(u => u.id === userId);
                if (idx !== -1) {
                    state.users[idx] = { ...state.users[idx], ...updates };
                    if (state.currentUser && state.currentUser.id === userId) {
                        state.currentUser = state.users[idx];
                    }
                }
                render();
            }
        }

        async function dbDeleteUser(userId) {
            if (useFirebase && db) {
                await deleteDoc(doc(db, 'users', userId));
            } else {
                state.users = state.users.filter(u => u.id !== userId);
                render();
            }
        }

        async function dbCreateCounseling(payload) {
            const data = {
                ...payload,
                createdAt: new Date().toISOString()
            };
            if (useFirebase && db) {
                await addDoc(collection(db, 'counselings'), data);
            } else {
                state.counselings.unshift({ id: 'cns-' + Date.now(), ...data });
                render();
            }
        }

        async function dbUpdateCounseling(id, updates) {
            if (useFirebase && db) {
                await updateDoc(doc(db, 'counselings', id), updates);
            } else {
                const idx = state.counselings.findIndex(c => c.id === id);
                if (idx !== -1) {
                    state.counselings[idx] = { ...state.counselings[idx], ...updates };

        }

        async function dbCreateCareer(payload) {

        async function dbDeleteCareer(id) {

            } else {
                state.careers = state.careers.filter(c => c.id !== id);
                render();
            }
        }

        async function dbUpdateGuruCode(newCode) {
            const clean = newCode.trim().toUpperCase();
            if (useFirebase && db) {
                await setDoc(doc(db, 'settings', 'config'), {
                    guruBkCode: clean,
                    updatedAt: new Date().toISOString()

            } else {
                state.guruBkCode = clean;
                render();
            }
        }

                        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/10 text-xs font-medium text-emerald-300 mb-6">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>

                    { id: 'students', label: 'Data Siswa & Minat', icon: 'users' },
                    { id: 'manage-careers', label: 'Kelola Info Karir', icon: 'book-marked' }

                { id: 'overview', label: 'Ringkasan Sistem', icon: 'activity' },
                { id: 'manage-users', label: 'Manajemen Pengguna', icon: 'users-round' },

                            <div class="relative w-full sm:w-64">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                                <input type="text" id="user-search-input" value="${escapeHtml(state.userSearch)}" placeholder="Cari nama atau email..."
                                    class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900">
                            </div>
                            <select id="user-role-filter" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                                <option value="Semua" ${state.userRoleFilter === 'Semua' ? 'selected' : ''}>Semua Peran</option>
                                <option value="siswa" ${state.userRoleFilter === 'siswa' ? 'selected' : ''}>Siswa</option>
                                <option value="guru_bk" ${state.userRoleFilter === 'guru_bk' ? 'selected' : ''}>Guru BK</option>
                                <option value="admin" ${state.userRoleFilter === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </div>

                        <button type="button" data-action="open-add-user-modal"
                            class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition flex items-center justify-center gap-1.5">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Tambah Pengguna
                        </button>
                    </div>

                    ${filtered.length === 0 ? `
                        <div class="text-center py-12 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                            <i data-lucide="users" class="w-9 h-9 text-slate-400 mx-auto mb-2.5"></i>
                            <p class="text-sm font-semibold text-slate-700">Tidak ada pengguna ditemukan</p>
                            <p class="text-xs text-slate-500 mt-1">Coba ubah filter pencarian atau tambahkan pengguna baru.</p>
                        </div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-500">
                                        <th class="py-3 px-3">Pengguna</th>
                                        <th class="py-3 px-3">Peran</th>
                                        <th class="py-3 px-3">Info Tambahan</th>
                                        <th class="py-3 px-3 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${filtered.map(u => `
                                        <tr class="hover:bg-slate-50/70">
                                            <td class="py-3.5 px-3">
                                                <div class="font-semibold text-slate-900">${escapeHtml(u.name)}</div>
                                                <div class="text-xs text-slate-500">${escapeHtml(u.email)}</div>
                                            </td>
                                            <td class="py-3.5 px-3">${getRoleBadge(u.role)}</td>
                                            <td class="py-3.5 px-3 text-xs text-slate-600">
                                                ${u.role === 'siswa' ? `Kelas ${escapeHtml(u.kelas || '-')}` : u.role === 'guru_bk' ? `NIP: ${escapeHtml(u.nip || '-')}` : 'Akses Penuh Sistem'}
                                            </td>
                                            <td class="py-3.5 px-3 text-right">
                                                ${u.id === state.currentUser.id ? `
                                                    <span class="text-xs text-slate-400 italic">Akun Anda</span>
                                                ` : `
                                                    <button type="button" data-action="confirm-delete-user" data-id="${u.id}" data-name="${escapeHtml(u.name)}"
                                                        class="px-3 py-1.5 rounded-lg text-rose-600 hover:bg-rose-50 text-xs font-semibold transition inline-flex items-center gap-1">
                                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                                                    </button>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
                `;
            }

            if (state.activeTab === 'security') {
                return `
                <div class="max-w-2xl">
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-xs">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                                <i data-lucide="key-round" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold text-slate-900">Pengaturan Kode Unik Guru BK</h2>
                                <p class="text-xs text-slate-500">Kode ini wajib dimasukkan oleh Guru BK saat mendaftar maupun masuk ke sistem.</p>
                            </div>
                        </div>

                        <div class="p-4 rounded-2xl bg-slate-900 text-white flex items-center justify-between mb-6">
                            <div>
                                <div class="text-[11px] uppercase tracking-wider text-slate-400">Kode Unik Aktif Saat Ini</div>
                                <div class="text-2xl font-mono font-extrabold tracking-widest text-emerald-400 mt-0.5">${escapeHtml(state.guruBkCode)}</div>
                            </div>
                            <span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-semibold">Aktif</span>
                        </div>

                        <form id="security-code-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Perbarui Kode Unik Baru</label>
                                <input type="text" id="new-guru-code" required minlength="4" maxlength="20" value="${escapeHtml(state.guruBkCode)}"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 font-mono font-bold uppercase tracking-widest text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500">
                                <p class="text-xs text-slate-500 mt-1.5">Gunakan kombinasi huruf/angka tanpa spasi (bawaan: <strong>GURUKU</strong>).</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-md shadow-indigo-600/20 transition">
                                    Simpan Perubahan Kode
                                </button>
                                <button type="button" data-action="reset-default-code" class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs font-semibold transition">
                                    Reset ke "GURUKU"
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            }

            return '';
        }

        // =====================================================================
        // 12. RENDER UTAMA & PENGIKATAN EVENT FORM
        // =====================================================================
        function render() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!state.currentUser) {
                root.innerHTML = renderAuthPage();
            } else {
                root.innerHTML = renderDashboardShell();
            }

            refreshIcons();
            bindDynamicEvents();
        }

        function bindDynamicEvents() {
            const authForm = document.getElementById('auth-form');
            if (authForm) {
                authForm.addEventListener('submit', handleAuthSubmit);
            }

            const cnsForm = document.getElementById('counseling-form');
            if (cnsForm) {
                cnsForm.addEventListener('submit', handleCounselingSubmit);
            }

            const careerForm = document.getElementById('career-add-form');
            if (careerForm) {
                careerForm.addEventListener('submit', handleCareerAddSubmit);
            }

            const secForm = document.getElementById('security-code-form');
            if (secForm) {
                secForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const val = document.getElementById('new-guru-code').value.trim().toUpperCase();
                    if (val.length < 4) {
                        showToast('Kode unik minimal 4 karakter.', 'error');
                        return;
                    }
                    await dbUpdateGuruCode(val);
                    showToast(`Kode unik Guru BK berhasil diperbarui menjadi "${val}".`, 'success');
                });
            }

            const careerSearchInput = document.getElementById('career-search-input');
            if (careerSearchInput) {
                careerSearchInput.addEventListener('input', (e) => {
                    state.careerSearch = e.target.value;
                    render();
                    const el = document.getElementById('career-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const studentSearchInput = document.getElementById('student-search-input');
            if (studentSearchInput) {
                studentSearchInput.addEventListener('input', (e) => {
                    state.studentSearch = e.target.value;
                    render();
                    const el = document.getElementById('student-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const userSearchInput = document.getElementById('user-search-input');
            if (userSearchInput) {
                userSearchInput.addEventListener('input', (e) => {
                    state.userSearch = e.target.value;
                    render();
                    const el = document.getElementById('user-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const userRoleFilter = document.getElementById('user-role-filter');
            if (userRoleFilter) {
                userRoleFilter.addEventListener('change', (e) => {
                    state.userRoleFilter = e.target.value;
                    render();
                });
            }
        }

        // =====================================================================
        // 13. HANDLER LOGIKA BISNIS (DAFTAR -> LOGIN, KONSELING, KARIR, KUIS)
        // =====================================================================
        async function handleAuthSubmit(e) {
            e.preventDefault();
            state.authError = '';
            state.authSuccess = '';

            const role = state.authRoleTab;
            const mode = state.authMode;
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;

            // Validasi Kode Unik Wajib untuk Guru BK
            if (role === 'guru_bk') {
                const enteredCode = (document.getElementById('auth-guru-code')?.value || '').trim().toUpperCase();
                if (enteredCode !== state.guruBkCode.toUpperCase()) {
                    state.authError = 'Kode unik Guru BK tidak valid. Silakan periksa kembali kode akses resmi dari Admin sekolah.';
                    render();
                    return;
                }
            }

            if (mode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                const kelas = role === 'siswa' ? document.getElementById('auth-kelas').value.trim() : '-';
                const nip = role === 'guru_bk' ? document.getElementById('auth-nip').value.trim() : '-';

                const exists = state.users.find(u => u.email.toLowerCase() === email);
                if (exists) {
                    state.authError = 'Email tersebut sudah terdaftar. Silakan masuk menggunakan akun Anda.';
                    render();
                    return;
                }

                await dbCreateUser({
                    name,
                    email,
                    password,
                    role,
                    kelas,
                    nip,
                    riasec: null
                });

                // Alur Daftar -> Login: Jangan langsung masuk dashboard
                e.target.reset();
                state.currentUser = null;
                state.authRoleTab = role;
                state.authMode = 'login';
                state.prefillEmail = email;
                state.authSuccess = 'Pendaftaran berhasil! Silakan login ulang menggunakan email dan kata sandi yang baru didaftarkan.';
                showToast('Pendaftaran berhasil! Silakan login ulang menggunakan email dan kata sandi yang baru didaftarkan.', 'success');
                render();
            } else {
                const found = state.users.find(u => u.email.toLowerCase() === email && u.password === password);
                if (!found) {
                    state.authError = 'Email atau kata sandi tidak cocok. Silakan periksa kembali atau daftar akun baru terlebih dahulu.';
                    render();
                    return;
                }
                if (found.role !== role) {
                    const roleLabel = found.role === 'guru_bk' ? 'Guru BK' : found.role === 'admin' ? 'Admin' : 'Siswa';
                    state.authError = `Akun ini terdaftar sebagai ${roleLabel}. Silakan pilih tab peran "${roleLabel}" untuk masuk.`;
                    render();
                    return;
                }

                state.currentUser = found;
                state.authSuccess = '';
                state.prefillEmail = '';
                state.activeTab = 'overview';
                state.quizActive = false;
                showToast(`Berhasil masuk sebagai ${found.name}.`, 'success');
                render();
            }
        }

        async function handleCounselingSubmit(e) {
            e.preventDefault();
            const user = state.currentUser;
            const topic = document.getElementById('cns-topic').value;
            const date = document.getElementById('cns-date').value;
            const time = document.getElementById('cns-time').value;
            const notes = document.getElementById('cns-notes').value.trim();

            await dbCreateCounseling({
                studentId: user.id,
                studentName: user.name,
                studentKelas: user.kelas || '-',
                topic,
                date,
                time,
                notes,
                status: 'Menunggu',
                guruNotes: ''
            });

            showToast('Pengajuan konseling berhasil dikirim ke Guru BK!', 'success');
            e.target.reset();
        }

        async function handleCareerAddSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('car-title').value.trim();
            const category = document.getElementById('car-category').value;
            const description = document.getElementById('car-desc').value.trim();
            const skills = document.getElementById('car-skills').value.split(',').map(s => s.trim()).filter(Boolean);
            const majors = document.getElementById('car-majors').value.split(',').map(s => s.trim()).filter(Boolean);
            const outlook = document.getElementById('car-outlook').value.trim();

            await dbCreateCareer({ title, category, description, skills, majors, outlook });
            showToast(`Informasi karir "${title}" berhasil dipublikasikan!`, 'success');
            e.target.reset();
        }

        async function finishQuiz() {
            const tally = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
            state.quizAnswers.forEach(code => {
                if (tally[code] !== undefined) tally[code]++;
            });
            const topCode = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || 'I';
            const profile = {
                ...RIASEC_PROFILES[topCode],
                completedAt: new Date().toISOString()
            };

            state.quizActive = false;
            await dbUpdateUser(state.currentUser.id, { riasec: profile });
            showToast(`Tes selesai! Tipe karir dominan Anda: ${profile.label}`, 'success');
        }

        // =====================================================================
        // 14. EVENT DELEGATION GLOBAL
        // =====================================================================
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;

            if (action === 'switch-role-tab') {
                state.authRoleTab = btn.dataset.role;
                state.authMode = 'login';
                state.authError = '';
                state.authSuccess = '';
                state.prefillEmail = '';
                render();
                return;
            }

            if (action === 'toggle-auth-mode') {
                state.authMode = state.authMode === 'login' ? 'register' : 'login';
                state.authError = '';
                state.authSuccess = '';
                state.prefillEmail = '';
                render();
                return;
            }

            if (action === 'switch-tab') {
                state.activeTab = btn.dataset.tab;
                state.mobileMenuOpen = false;
                render();
                return;
            }

            if (action === 'open-mobile-menu') {
                state.mobileMenuOpen = true;
                render();
                return;
            }

            if (action === 'close-mobile-menu') {
                state.mobileMenuOpen = false;
                render();
                return;
            }

            if (action === 'logout') {
                state.currentUser = null;
                state.authError = '';
                state.authSuccess = '';
                state.prefillEmail = '';
                state.mobileMenuOpen = false;
                showToast('Anda telah keluar dari akun.', 'info');
                render();
                return;
            }

            if (action === 'start-quiz') {
                state.quizActive = true;
                state.quizStep = 0;
                state.quizAnswers = [];
                render();
                return;
            }

            if (action === 'answer-quiz') {
                state.quizAnswers.push(btn.dataset.code);
                if (state.quizStep + 1 < RIASEC_QUESTIONS.length) {
                    state.quizStep++;
                    render();
                } else {
                    await finishQuiz();
                }
                return;
            }

            if (action === 'filter-career-cat') {
                state.careerCategoryFilter = btn.dataset.cat;
                render();
                return;
            }

            if (action === 'view-career') {
                const car = state.careers.find(c => c.id === btn.dataset.id);
                if (!car) return;
                openModal(`
                    <div class="p-6">
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div>
                                <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-bold">${escapeHtml(car.category)}</span>
                                <h3 class="text-xl font-extrabold text-slate-900 mt-2">${escapeHtml(car.title)}</h3>
                            </div>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p class="text-sm text-slate-600 leading-relaxed mb-5">${escapeHtml(car.description)}</p>

                        <div class="space-y-4">
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                                <div class="text-xs font-bold text-slate-800 mb-2">Keterampilan Utama</div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${(car.skills || []).map(s => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-700">${escapeHtml(s)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="p-4 rounded-xl bg-indigo-50/70 border border-indigo-100">
                                <div class="text-xs font-bold text-indigo-900 mb-2">Jurusan Kuliah Terkait</div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${(car.majors || []).map(m => `<span class="px-2.5 py-1 rounded-lg bg-white border border-indigo-200 text-xs font-semibold text-indigo-800">${escapeHtml(m)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="p-4 rounded-xl bg-emerald-50/70 border border-emerald-100">
                                <div class="text-xs font-bold text-emerald-900 mb-1">Prospek Karir / Estimasi Gaji</div>
                                <p class="text-xs text-emerald-800">${escapeHtml(car.outlook || 'Prospek berkembang')}</p>
                            </div>
                        </div>

                        <div class="mt-6 flex justify-end">
                            <button type="button" data-action="close-modal" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition">Tutup</button>
                        </div>
                    </div>
                `);
                return;
            }

            if (action === 'filter-cns-status') {
                state.counselingStatusFilter = btn.dataset.status;
                render();
                return;
            }

            if (action === 'quick-cns-status') {
                await dbUpdateCounseling(btn.dataset.id, { status: btn.dataset.status });
                showToast(`Status konseling diperbarui menjadi "${btn.dataset.status}".`, 'success');
                return;
            }

            if (action === 'open-counseling-modal') {
                const c = state.counselings.find(item => item.id === btn.dataset.id);
                if (!c) return;
                openModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-900">Tanggapi &amp; Catatan Bimbingan</h3>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs mb-4">
                            <div class="font-bold text-slate-900">${escapeHtml(c.studentName)} (${escapeHtml(c.studentKelas || '-')})</div>
                            <div class="text-indigo-700 font-semibold mt-0.5">${escapeHtml(c.topic)}</div>
                            <div class="text-slate-600 mt-1">${escapeHtml(c.notes)}</div>
                        </div>
                        <form id="modal-cns-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Status Sesi</label>
                                <select id="modal-cns-status" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                    ${['Menunggu', 'Disetujui', 'Selesai', 'Ditolak'].map(st => `<option value="${st}" ${c.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Catatan / Balasan Guru BK</label>
                                <textarea id="modal-cns-notes" rows="4" placeholder="Tulis konfirmasi jadwal, saran jurusan, atau ringkasan hasil bimbingan..."
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500">${escapeHtml(c.guruNotes || '')}</textarea>
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                                <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">Simpan Tanggapan</button>
                            </div>
                        </form>
                    </div>
                `);
                document.getElementById('modal-cns-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    const status = document.getElementById('modal-cns-status').value;
                    const guruNotes = document.getElementById('modal-cns-notes').value.trim();
                    await dbUpdateCounseling(c.id, { status, guruNotes });
                    closeModal();
                    showToast('Catatan bimbingan berhasil disimpan.', 'success');
                });
                return;
            }

            if (action === 'delete-career') {
                await dbDeleteCareer(btn.dataset.id);
                showToast('Informasi karir berhasil dihapus.', 'info');
                return;
            }

            if (action === 'open-add-user-modal') {
                openModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-900">Tambah Akun Pengguna Baru</h3>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="modal-add-user-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Peran</label>
                                <select id="mu-role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                    <option value="siswa">Siswa</option>
                                    <option value="guru_bk">Guru BK</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Lengkap</label>
                                <input type="text" id="mu-name" required placeholder="Nama lengkap pengguna" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
                                <input type="email" id="mu-email" required placeholder="nama@email.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kata Sandi</label>
                                <input type="password" id="mu-password" required minlength="4" placeholder="Minimal 4 karakter" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kelas (Siswa) / NIP (Guru BK)</label>
                                <input type="text" id="mu-extra" placeholder="Opsional untuk Admin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                                <button type="submit" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Simpan Pengguna</button>
                            </div>
                        </form>
                    </div>
                `);
                document.getElementById('modal-add-user-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    const role = document.getElementById('mu-role').value;
                    const name = document.getElementById('mu-name').value.trim();
                    const email = document.getElementById('mu-email').value.trim().toLowerCase();
                    const password = document.getElementById('mu-password').value;
                    const extra = document.getElementById('mu-extra').value.trim() || '-';

                    if (state.users.some(u => u.email.toLowerCase() === email)) {
                        showToast('Email sudah terdaftar di sistem.', 'error');
                        return;
                    }
                    await dbCreateUser({
                        name, email, password, role,
                        kelas: role === 'siswa' ? extra : '-',
                        nip: role === 'guru_bk' ? extra : '-',
                        riasec: null
                    });
                    closeModal();
                    showToast(`Akun ${name} berhasil ditambahkan.`, 'success');
                });
                return;
            }

            if (action === 'confirm-delete-user') {
                const uid = btn.dataset.id;
                const uname = btn.dataset.name;
                openModal(`
                    <div class="p-6 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">Hapus Akun Pengguna?</h3>
                        <p class="text-xs text-slate-500 mb-6">Anda yakin ingin menghapus akun <strong>${escapeHtml(uname)}</strong>? Tindakan ini tidak dapat dibatalkan.</p>
                        <div class="flex justify-center gap-3">
                            <button type="button" data-action="close-modal" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                            <button type="button" id="do-delete-user-btn" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus Akun</button>
                        </div>
                    </div>
                `);
                document.getElementById('do-delete-user-btn').addEventListener('click', async () => {
                    await dbDeleteUser(uid);
                    closeModal();
                    showToast(`Akun ${uname} berhasil dihapus.`, 'info');
                });
                return;
            }

            if (action === 'reset-default-code') {
                await dbUpdateGuruCode(DEFAULT_GURU_CODE);
                showToast(`Kode unik berhasil dikembalikan ke "${DEFAULT_GURU_CODE}".`, 'success');
                return;
            }

            if (action === 'close-modal') {
                closeModal();
                return;
            }
        });

        // =====================================================================
        // 15. INISIALISASI SAAT HALAMAN SIAP
        // =====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            refreshIcons();
            initFirebaseAndData();
        });
    </script>
</body>
</html>
