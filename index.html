        // =====================================================================

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch {
                return dateStr;
            }
        }

            const icons = {
                success: 'check-circle-2',
                error: 'alert-circle',
                info: 'info',
                warning: 'alert-triangle'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-start gap-3 px-4 py-3.5 rounded-xl shadow-xl text-sm font-medium fade-in ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <div class="flex-1 leading-snug">${escapeHtml(message)}</div>
            `;
            container.appendChild(toast);
            refreshIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(12px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 260);
            }, 3600);
        }

        // =====================================================================
        // 6. LAPISAN DATA (FIREBASE FIRESTORE + FALLBACK MEMORI)
        // =====================================================================
        function colRef(name) {
            return collection(db, 'artifacts', appId, 'public', 'data', name);
        }

        function docRef(name, id) {
            return doc(db, 'artifacts', appId, 'public', 'data', name, id);
        }

        async function initFirebaseAndData() {
            const loaderStatus = document.getElementById('loader-status');

            if (firebaseConfig && firebaseConfig.apiKey) {
                try {
                    loaderStatus.textContent = 'Mengautentikasi sesi Firebase...';
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    // RULE 3: Autentikasi terlebih dahulu sebelum operasi Firestore
                    if (initialAuthToken) {
                        const cred = await signInWithCustomToken(auth, initialAuthToken);
                        firebaseUser = cred.user;
                    } else {
                        const cred = await signInAnonymously(auth);
                        firebaseUser = cred.user;
                    }

                    useFirebase = true;
                    state.isFirebaseConnected = true;

                    loaderStatus.textContent = 'Menyiapkan data awal Grow Impian...';
                    await seedDatabaseIfEmpty();

                    loaderStatus.textContent = 'Menyinkronkan data real-time...';
                    attachRealtimeListeners();
                } catch (err) {
                    console.error('Firebase error, beralih ke mode memori lokal:', err);
                    initFallbackMemoryMode();
                }
            } else {
                initFallbackMemoryMode();
            }

            // Sembunyikan loader & render tampilan awal
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
                render();
            }, 350);
        }

        function initFallbackMemoryMode() {
            useFirebase = false;
            state.isFirebaseConnected = false;
            state.users = JSON.parse(JSON.stringify(SEED_USERS));
            state.careers = JSON.parse(JSON.stringify(SEED_CAREERS));
            state.counselings = JSON.parse(JSON.stringify(SEED_COUNSELINGS));
            state.guruBkCode = DEFAULT_GURU_CODE;
        }

        async function seedDatabaseIfEmpty() {
            if (!useFirebase || !firebaseUser) return;

            // Cek & seed settings/security
            const secRef = docRef('settings', 'security');
            const secSnap = await getDoc(secRef);
            if (!secSnap.exists()) {
                await setDoc(secRef, {
                    guruBkCode: DEFAULT_GURU_CODE,
                    updatedAt: new Date().toISOString()
                });
            }

            // Cek & seed users
            const usersSnap = await getDocs(colRef('users'));
            if (usersSnap.empty) {
                for (const u of SEED_USERS) {
                    await setDoc(docRef('users', u.id), u);
                }
            }

            // Cek & seed careers
            const careersSnap = await getDocs(colRef('careers'));
            if (careersSnap.empty) {
                for (const c of SEED_CAREERS) {
                    await setDoc(docRef('careers', c.id), c);
                }
            }

            // Cek & seed counselings
            const cnsSnap = await getDocs(colRef('counselings'));
            if (cnsSnap.empty) {
                for (const cs of SEED_COUNSELINGS) {
                    await setDoc(docRef('counselings', cs.id), cs);
                }
            }
        }

        function attachRealtimeListeners() {
            if (!useFirebase || !firebaseUser) return;

            // Listener Users
            onSnapshot(colRef('users'), (snap) => {
                state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // Perbarui referensi currentUser jika sedang login
                if (state.currentUser) {
                    const updated = state.users.find(u => u.id === state.currentUser.id);
                    if (updated) state.currentUser = updated;
                }
                render();
            }, (err) => {
                console.error('Error listener users:', err);
            });

            // Listener Careers
            onSnapshot(colRef('careers'), (snap) => {
                state.careers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => {
                console.error('Error listener careers:', err);
            });

            // Listener Counselings
            onSnapshot(colRef('counselings'), (snap) => {
                state.counselings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // Sort di memori JavaScript berdasarkan createdAt terbaru
                state.counselings.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                render();
            }, (err) => {
                console.error('Error listener counselings:', err);
            });

            // Listener Security Settings (Kode Unik Guru BK)
            onSnapshot(docRef('settings', 'security'), (snap) => {
                if (snap.exists() && snap.data().guruBkCode) {
                    state.guruBkCode = snap.data().guruBkCode;
                } else {
                    state.guruBkCode = DEFAULT_GURU_CODE;
                }
                render();
            }, (err) => {
                console.error('Error listener settings:', err);
            });
        }

        // ---- OPERASI CRUD TERPADU ----
        async function dbCreateUser(userObj) {
            const newId = 'usr-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
            const payload = { ...userObj, id: newId, createdAt: new Date().toISOString() };
            if (useFirebase && firebaseUser) {
                await setDoc(docRef('users', newId), payload);
            } else {
                state.users.push(payload);
                render();
            }
            return payload;
        }

        async function dbUpdateUser(userId, updates) {
            if (useFirebase && firebaseUser) {
                await updateDoc(docRef('users', userId), updates);
            } else {
                const idx = state.users.findIndex(u => u.id === userId);
                if (idx !== -1) {
                    state.users[idx] = { ...state.users[idx], ...updates };
                    if (state.currentUser && state.currentUser.id === userId) {
                        state.currentUser = state.users[idx];
                    }
                }
                render();
            }
        }

        async function dbDeleteUser(userId) {
            if (useFirebase && firebaseUser) {
                await deleteDoc(docRef('users', userId));
            } else {
                state.users = state.users.filter(u => u.id !== userId);
                render();
            }
        }

        async function dbCreateCounseling(cnsObj) {
            const newId = 'cns-' + Date.now();
            const payload = { ...cnsObj, id: newId, createdAt: new Date().toISOString() };
            if (useFirebase && firebaseUser) {
                await setDoc(docRef('counselings', newId), payload);
            } else {
                state.counselings.unshift(payload);
                render();
            }
            return payload;
        }

        async function dbUpdateCounseling(cnsId, updates) {
            if (useFirebase && firebaseUser) {
                await updateDoc(docRef('counselings', cnsId), updates);
            } else {
                const idx = state.counselings.findIndex(c => c.id === cnsId);
                if (idx !== -1) {
                    state.counselings[idx] = { ...state.counselings[idx], ...updates };
                }
                render();
            }
        }

        async function dbCreateCareer(carObj) {
            const newId = 'car-' + Date.now();
            const payload = { ...carObj, id: newId, createdAt: new Date().toISOString() };
            if (useFirebase && firebaseUser) {

        async function dbDeleteCareer(carId) {

        async function dbUpdateGuruCode(newCode) {
            const cleanCode = newCode.trim().toUpperCase();
            if (useFirebase && firebaseUser) {

                    guruBkCode: cleanCode,

        function renderDashboardShell() {

                    <!-- Navigation Links -->
                    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                        <div class="px-3 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Menu Utama</div>
                        ${navItems.map(item => {

                                <button type="button" data-action="switch-tab" data-tab="${item.id}"

                            `;

                    </nav>

                    <!-- User Profile Card & Logout -->
                    <div class="p-4 border-t border-slate-800 space-y-3">
                        <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/70">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-emerald-500 text-white font-bold text-xs flex items-center justify-center shrink-0">
                                ${escapeHtml(initials)}

                                <div class="text-xs font-bold text-white truncate">${escapeHtml(user.name)}</div>

                        <button type="button" data-action="logout"

                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            <span>Keluar dari Akun</span>
                        </button>
                    </div>
                </aside>

                <!-- KONTEN UTAMA -->
                <div class="flex-1 flex flex-col min-w-0">
                    <!-- Top Header -->
                    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3 min-w-0">
                            <button type="button" data-action="open-mobile-menu" class="lg:hidden p-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100">

        // =====================================================================
        // 9. DASHBOARD SISWA
        // =====================================================================

                        </div>

                    </div>

                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-slate-500">Rekomendasi Karir</span>
                            <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                                <i data-lucide="briefcase" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="text-2xl font-extrabold text-slate-900">${recCount} Profesi</div>
                        <p class="text-xs text-slate-500 mt-1">${user.riasec ? 'Disesuaikan dengan minat RIASEC Anda' : 'Jelajahi katalog karir tersedia'}</p>
                    </div>
                </div>

                <!-- Profil Karir & Aksi Cepat -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                            <div>
                                <h2 class="text-base font-bold text-slate-900">Profil Karir Siswa</h2>
                                <p class="text-xs text-slate-500">Kelas ${escapeHtml(user.kelas || '-')} &bull; ${escapeHtml(user.email)}</p>
                            </div>
                            <button type="button" data-action="switch-tab" data-tab="quiz"
                                class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition flex items-center gap-1.5">
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                <span>${user.riasec ? 'Ulangi Tes Minat' : 'Mulai Tes Minat'}</span>
                            </button>
                        </div>

                        ${user.riasec ? `
                            <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-indigo-950 text-white mb-4">
                                <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1">Tipe Kepribadian Karir Dominan</div>
                                <div class="text-xl font-extrabold mb-2">${escapeHtml(user.riasec.label)}</div>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${escapeHtml(user.riasec.summary)}</p>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                                    <div class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1.5">
                                        <i data-lucide="briefcase" class="w-4 h-4 text-emerald-600"></i> Rekomendasi Profesi
                                    </div>
                                    <ul class="space-y-1.5 text-xs text-slate-600">

                                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                                    <div class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1.5">

                                        ${user.riasec.majors.map(m => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-700">${escapeHtml(m)}</span>`).join('')}
                                    </div>
                                </div>

                        ` : `
                            <div class="p-8 rounded-2xl bg-slate-50 border border-dashed border-slate-300 text-center">

                                    <i data-lucide="compass" class="w-6 h-6"></i>

                                <h3 class="text-sm font-bold text-slate-900">Belum Ada Hasil Tes Minat Karir</h3>
                                <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Kenali potensi dan kecocokan karir Anda melalui Tes Minat RIASEC singkat hanya dalam 2 menit.</p>
                                <button type="button" data-action="switch-tab" data-tab="quiz"
                                    class="mt-4 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition">
                                    Ikuti Tes Sekarang
                                </button>
                            </div>
                        `}

                                    <div class="flex items-start justify-between gap-2 mb-1">

                                        ${getStatusBadge(c.status)}
                                    </div>
                                    <div class="text-[11px] text-slate-500 flex items-center gap-2">
                                        <span>${formatDate(c.date)}</span> &bull; <span>${escapeHtml(c.time)} WIB</span>
                                    </div>
                                    ${c.guruNotes ? `<p class="text-[11px] text-indigo-700 bg-indigo-50 rounded-lg p-2 mt-2 border border-indigo-100"><strong>Guru BK:</strong> ${escapeHtml(c.guruNotes)}</p>` : ''}

                            + Ajukan Jadwal Konseling

                    </div>
                </div>
                `;
            }

            if (state.activeTab === 'quiz') {
                return renderStudentQuiz();
            }

            if (state.activeTab === 'counseling') {
                return `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Form Pengajuan Konseling -->
                    <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs h-fit">
                        <h2 class="text-base font-bold text-slate-900 mb-1">Ajukan Sesi Bimbingan BK</h2>
                        <p class="text-xs text-slate-500 mb-5">Pilih jadwal yang nyaman untuk berdiskusi bersama Guru BK.</p>

                        <form id="counseling-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Topik Bimbingan</label>
                                <select id="cns-topic" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500">
                                    <option value="Pemilihan Jurusan Kuliah (SNBP/SNBT)">Pemilihan Jurusan Kuliah (SNBP/SNBT)</option>
                                    <option value="Eksplorasi Minat & Bakat Karir">Eksplorasi Minat &amp; Bakat Karir</option>
                                    <option value="Persiapan Portofolio & Karir Masa Depan">Persiapan Portofolio &amp; Karir Masa Depan</option>
                                    <option value="Konsultasi Akademik & Strategi Belajar">Konsultasi Akademik &amp; Strategi Belajar</option>
                                    <option value="Konseling Pribadi & Motivasi">Konseling Pribadi &amp; Motivasi</option>

                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Catatan / Pertanyaan Anda</label>
                                <textarea id="cns-notes" rows="3" required placeholder="Ceritakan secara singkat hal yang ingin Anda diskusikan..."
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-md shadow-emerald-600/20 transition">
                                Kirim Pengajuan Konseling
                            </button>
                        </form>
                    </div>

                    <!-- Riwayat Pengajuan -->
                    <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">

                            <div>

                                <p class="text-xs text-slate-500">Pantau status persetujuan dan catatan balasan dari Guru BK.</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-xs font-semibold text-slate-600">${myCounselings.length} Sesi</span>
                        </div>

                        ${myCounselings.length === 0 ? `
                            <div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <i data-lucide="calendar-x" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
                                <p class="text-sm font-medium text-slate-600">Belum ada riwayat konseling</p>
                                <p class="text-xs text-slate-400 mt-1">Gunakan formulir di samping untuk mengajukan jadwal pertama Anda.</p>
                            </div>
                        ` : `
                            <div class="space-y-4">
                                ${myCounselings.map(c => `
                                    <div class="p-4 rounded-2xl border border-slate-200 hover:border-slate-300 transition bg-white">
                                        <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
                                            <div>
                                                <h3 class="text-sm font-bold text-slate-900">${escapeHtml(c.topic)}</h3>
                                                <div class="text-xs text-slate-500 flex items-center gap-2 mt-0.5">
                                                    <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${formatDate(c.date)}</span>
                                                    <span>&bull;</span>
                                                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${escapeHtml(c.time)} WIB</span>

                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
                `;
            }

            if (state.activeTab === 'careers') {
                const categories = ['Semua', 'Teknologi', 'Bisnis', 'Kesehatan', 'Kreatif', 'Pendidikan'];
                const filtered = state.careers.filter(c => {
                    const matchCat = state.careerCategoryFilter === 'Semua' || c.category === state.careerCategoryFilter;

                return `

        // =====================================================================
        // 12. RENDER UTAMA & PENGIKATAN EVENT
        // =====================================================================
        function render() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!state.currentUser) {
                root.innerHTML = renderAuthPage();
            } else {
                root.innerHTML = renderDashboardShell();
            }

            refreshIcons();
            bindDynamicEvents();
        }

        function bindDynamicEvents() {
            // Form Login / Register
            const authForm = document.getElementById('auth-form');
            if (authForm) {
                authForm.addEventListener('submit', handleAuthSubmit);
            }

            // Form Pengajuan Konseling Siswa
            const cnsForm = document.getElementById('counseling-form');
            if (cnsForm) {
                cnsForm.addEventListener('submit', handleCounselingSubmit);
            }

            // Form Tambah Karir (Guru BK)
            const careerForm = document.getElementById('career-add-form');
            if (careerForm) {
                careerForm.addEventListener('submit', handleCareerAddSubmit);
            }

            // Form Update Kode Unik (Admin)
            const secForm = document.getElementById('security-code-form');
            if (secForm) {
                secForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const val = document.getElementById('new-guru-code').value.trim().toUpperCase();
                    if (val.length < 4) {
                        showToast('Kode unik minimal 4 karakter.', 'error');
                        return;
                    }
                    await dbUpdateGuruCode(val);
                    showToast(`Kode unik Guru BK berhasil diperbarui menjadi "${val}".`, 'success');
                });
            }

            // Pencarian real-time tanpa kehilangan fokus
            const careerSearchInput = document.getElementById('career-search-input');
            if (careerSearchInput) {
                careerSearchInput.addEventListener('input', (e) => {
                    state.careerSearch = e.target.value;
                    render();
                    const el = document.getElementById('career-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const studentSearchInput = document.getElementById('student-search-input');
            if (studentSearchInput) {
                studentSearchInput.addEventListener('input', (e) => {
                    state.studentSearch = e.target.value;
                    render();
                    const el = document.getElementById('student-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const userSearchInput = document.getElementById('user-search-input');
            if (userSearchInput) {
                userSearchInput.addEventListener('input', (e) => {
                    state.userSearch = e.target.value;
                    render();
                    const el = document.getElementById('user-search-input');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                });
            }

            const userRoleFilter = document.getElementById('user-role-filter');
            if (userRoleFilter) {
                userRoleFilter.addEventListener('change', (e) => {
                    state.userRoleFilter = e.target.value;
                    render();
                });
            }
        }

        // =====================================================================
        // 13. HANDLER LOGIKA BISNIS & INTERAKSI
        // =====================================================================
        async function handleAuthSubmit(e) {
            e.preventDefault();
            state.authError = '';

            const role = state.authRoleTab;
            const mode = role === 'admin' ? 'login' : state.authMode;
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;

            // Validasi Kode Unik Wajib untuk Guru BK
            if (role === 'guru_bk') {
                const enteredCode = (document.getElementById('auth-guru-code')?.value || '').trim().toUpperCase();
                if (enteredCode !== state.guruBkCode.toUpperCase()) {
                    state.authError = 'Kode unik Guru BK tidak valid. Silakan periksa kembali kode akses resmi dari Admin sekolah.';
                    render();
                    return;
                }
            }

            if (mode === 'register') {
                const name = document.getElementById('auth-name').value.trim();
                const kelas = role === 'siswa' ? document.getElementById('auth-kelas').value.trim() : '-';
                const nip = role === 'guru_bk' ? document.getElementById('auth-nip').value.trim() : '-';

                const exists = state.users.find(u => u.email.toLowerCase() === email);
                if (exists) {
                    state.authError = 'Email tersebut sudah terdaftar. Silakan masuk menggunakan akun Anda.';
                    render();
                    return;
                }

                const newUser = await dbCreateUser({
                    name,
                    email,
                    password,
                    role,
                    kelas,
                    nip,
                    riasec: null
                });

                state.currentUser = newUser;
                state.activeTab = 'overview';
                showToast(`Pendaftaran berhasil! Selamat datang, ${newUser.name}.`, 'success');
                render();
            } else {
                const found = state.users.find(u => u.email.toLowerCase() === email && u.password === password);
                if (!found) {
                    state.authError = 'Email atau kata sandi tidak cocok. Silakan periksa kembali kredensial Anda.';
                    render();
                    return;
                }
                if (found.role !== role) {
                    const roleLabel = found.role === 'guru_bk' ? 'Guru BK' : found.role === 'admin' ? 'Admin' : 'Siswa';
                    state.authError = `Akun ini terdaftar sebagai ${roleLabel}. Silakan pilih tab peran "${roleLabel}" untuk masuk.`;
                    render();
                    return;
                }

                state.currentUser = found;
                state.activeTab = 'overview';
                state.quizActive = false;
                showToast(`Berhasil masuk sebagai ${found.name}.`, 'success');
                render();
            }
        }

        async function handleCounselingSubmit(e) {
            e.preventDefault();
            const user = state.currentUser;
            const topic = document.getElementById('cns-topic').value;
            const date = document.getElementById('cns-date').value;
            const time = document.getElementById('cns-time').value;
            const notes = document.getElementById('cns-notes').value.trim();

            await dbCreateCounseling({
                studentId: user.id,
                studentName: user.name,
                studentKelas: user.kelas || '-',
                topic,
                date,
                time,
                notes,
                status: 'Menunggu',
                guruNotes: ''
            });

            showToast('Pengajuan konseling berhasil dikirim ke Guru BK!', 'success');
            e.target.reset();
        }

        async function handleCareerAddSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('car-title').value.trim();
            const category = document.getElementById('car-category').value;
            const description = document.getElementById('car-desc').value.trim();
            const skills = document.getElementById('car-skills').value.split(',').map(s => s.trim()).filter(Boolean);
            const majors = document.getElementById('car-majors').value.split(',').map(s => s.trim()).filter(Boolean);
            const outlook = document.getElementById('car-outlook').value.trim();

            await dbCreateCareer({ title, category, description, skills, majors, outlook });
            showToast(`Informasi karir "${title}" berhasil dipublikasikan!`, 'success');
            e.target.reset();
        }

        async function finishQuiz() {
            // Hitung frekuensi kode RIASEC
            const tally = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
            state.quizAnswers.forEach(code => {
                if (tally[code] !== undefined) tally[code]++;
            });
            const topCode = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || 'I';
            const profile = {
                ...RIASEC_PROFILES[topCode],
                completedAt: new Date().toISOString()
            };

            state.quizActive = false;
            await dbUpdateUser(state.currentUser.id, { riasec: profile });
            showToast(`Tes selesai! Tipe karir dominan Anda: ${profile.label}`, 'success');
        }

        // =====================================================================
        // 14. EVENT DELEGATION GLOBAL UNTUK SEMUA TOMBOL
        // =====================================================================
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;

            // --- AUTH ACTIONS ---
            if (action === 'switch-role-tab') {
                state.authRoleTab = btn.dataset.role;
                state.authMode = 'login';
                state.authError = '';
                render();
                return;
            }

            if (action === 'toggle-auth-mode') {
                state.authMode = state.authMode === 'login' ? 'register' : 'login';
                state.authError = '';
                render();
                return;
            }

            // --- NAVIGATION & SHELL ---
            if (action === 'switch-tab') {
                state.activeTab = btn.dataset.tab;
                state.mobileMenuOpen = false;
                render();
                return;
            }

            if (action === 'open-mobile-menu') {
                state.mobileMenuOpen = true;
                render();
                return;
            }

            if (action === 'close-mobile-menu') {
                state.mobileMenuOpen = false;
                render();
                return;
            }

            if (action === 'logout') {
                state.currentUser = null;
                state.authError = '';
                state.mobileMenuOpen = false;
                showToast('Anda telah keluar dari akun.', 'info');
                render();
                return;
            }

            // --- STUDENT QUIZ ---
            if (action === 'start-quiz') {
                state.quizActive = true;
                state.quizStep = 0;
                state.quizAnswers = [];
                render();
                return;
            }

            if (action === 'answer-quiz') {
                state.quizAnswers.push(btn.dataset.code);
                if (state.quizStep + 1 < RIASEC_QUESTIONS.length) {
                    state.quizStep++;
                    render();
                } else {
                    await finishQuiz();
                }
                return;
            }

            // --- CAREER FILTER & DETAIL MODAL ---
            if (action === 'filter-career-cat') {
                state.careerCategoryFilter = btn.dataset.cat;
                render();
                return;
            }

            if (action === 'view-career') {
                const car = state.careers.find(c => c.id === btn.dataset.id);
                if (!car) return;
                openModal(`
                    <div class="p-6">
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div>
                                <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-bold">${escapeHtml(car.category)}</span>
                                <h3 class="text-xl font-extrabold text-slate-900 mt-2">${escapeHtml(car.title)}</h3>
                            </div>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p class="text-sm text-slate-600 leading-relaxed mb-5">${escapeHtml(car.description)}</p>

                        <div class="space-y-4">
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                                <div class="text-xs font-bold text-slate-800 mb-2">Keahlian / Skill Utama</div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${(car.skills || []).map(s => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-700">${escapeHtml(s)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="p-4 rounded-xl bg-indigo-50/70 border border-indigo-100">
                                <div class="text-xs font-bold text-indigo-900 mb-2">Jurusan Kuliah Terkait</div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${(car.majors || []).map(m => `<span class="px-2.5 py-1 rounded-lg bg-white border border-indigo-200 text-xs font-semibold text-indigo-800">${escapeHtml(m)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="p-4 rounded-xl bg-emerald-50/70 border border-emerald-100">
                                <div class="text-xs font-bold text-emerald-900 mb-1">Prospek Karir</div>
                                <p class="text-xs text-emerald-800">${escapeHtml(car.outlook || 'Prospek cerah dan terus berkembang')}</p>
                            </div>
                        </div>

                        <div class="mt-6 flex justify-end">
                            <button type="button" data-action="close-modal" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition">Tutup</button>
                        </div>
                    </div>
                `);
                return;
            }

            // --- GURU BK ACTIONS ---
            if (action === 'filter-cns-status') {
                state.counselingStatusFilter = btn.dataset.status;
                render();
                return;
            }

            if (action === 'quick-cns-status') {
                const id = btn.dataset.id;
                const status = btn.dataset.status;
                await dbUpdateCounseling(id, { status });
                showToast(`Status konseling diperbarui menjadi "${status}".`, 'success');
                return;
            }

            if (action === 'open-counseling-modal') {
                const c = state.counselings.find(item => item.id === btn.dataset.id);
                if (!c) return;
                openModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-900">Tanggapi &amp; Catatan Bimbingan</h3>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs mb-4">
                            <div class="font-bold text-slate-900">${escapeHtml(c.studentName)} (${escapeHtml(c.studentKelas || '-')})</div>
                            <div class="text-indigo-700 font-semibold mt-0.5">${escapeHtml(c.topic)}</div>
                            <div class="text-slate-600 mt-1">${escapeHtml(c.notes)}</div>
                        </div>
                        <form id="modal-cns-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Status Sesi</label>
                                <select id="modal-cns-status" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                    ${['Menunggu', 'Disetujui', 'Selesai', 'Ditolak'].map(st => `<option value="${st}" ${c.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Catatan / Balasan Guru BK</label>
                                <textarea id="modal-cns-notes" rows="4" placeholder="Tulis konfirmasi jadwal, saran jurusan, atau ringkasan hasil bimbingan..."
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500">${escapeHtml(c.guruNotes || '')}</textarea>
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                                <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">Simpan Tanggapan</button>
                            </div>
                        </form>
                    </div>
                `);
                document.getElementById('modal-cns-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    const status = document.getElementById('modal-cns-status').value;
                    const guruNotes = document.getElementById('modal-cns-notes').value.trim();
                    await dbUpdateCounseling(c.id, { status, guruNotes });
                    closeModal();
                    showToast('Catatan bimbingan berhasil disimpan.', 'success');
                });
                return;
            }

            if (action === 'delete-career') {
                await dbDeleteCareer(btn.dataset.id);
                showToast('Informasi karir berhasil dihapus.', 'info');
                return;
            }

            // --- ADMIN ACTIONS ---
            if (action === 'open-add-user-modal') {
                openModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-900">Tambah Akun Pengguna Baru</h3>
                            <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="modal-add-user-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Peran</label>
                                <select id="mu-role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                    <option value="siswa">Siswa</option>
                                    <option value="guru_bk">Guru BK</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Lengkap</label>
                                <input type="text" id="mu-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
                                <input type="email" id="mu-email" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kata Sandi</label>
                                <input type="password" id="mu-password" required minlength="4" value="123456" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kelas (untuk Siswa) / NIP (untuk Guru BK)</label>
                                <input type="text" id="mu-extra" required placeholder="Contoh: XII IPA 1 atau NIP Guru" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                                <button type="submit" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Simpan Pengguna</button>
                            </div>
                        </form>
                    </div>
                `);
                document.getElementById('modal-add-user-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    const role = document.getElementById('mu-role').value;
                    const name = document.getElementById('mu-name').value.trim();
                    const email = document.getElementById('mu-email').value.trim().toLowerCase();
                    const password = document.getElementById('mu-password').value;
                    const extra = document.getElementById('mu-extra').value.trim();

                    if (state.users.some(u => u.email.toLowerCase() === email)) {
                        showToast('Email sudah terdaftar di sistem.', 'error');
                        return;
                    }
                    await dbCreateUser({
                        name, email, password, role,
                        kelas: role === 'siswa' ? extra : '-',
                        nip: role === 'guru_bk' ? extra : '-',
                        riasec: null
                    });
                    closeModal();
                    showToast(`Akun ${name} berhasil ditambahkan.`, 'success');
                });
                return;
            }

            if (action === 'confirm-delete-user') {
                const uid = btn.dataset.id;
                const uname = btn.dataset.name;
                openModal(`
                    <div class="p-6 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">Hapus Akun Pengguna?</h3>
                        <p class="text-xs text-slate-500 mb-6">Anda yakin ingin menghapus akun <strong>${escapeHtml(uname)}</strong>? Tindakan ini tidak dapat dibatalkan.</p>
                        <div class="flex justify-center gap-3">
                            <button type="button" data-action="close-modal" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Batal</button>
                            <button type="button" id="do-delete-user-btn" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus Akun</button>
                        </div>
                    </div>
                `);
                document.getElementById('do-delete-user-btn').addEventListener('click', async () => {
                    await dbDeleteUser(uid);
                    closeModal();
                    showToast(`Akun ${uname} berhasil dihapus.`, 'info');
                });
                return;
            }

            if (action === 'reset-default-code') {
                await dbUpdateGuruCode(DEFAULT_GURU_CODE);
                showToast(`Kode unik berhasil dikembalikan ke "${DEFAULT_GURU_CODE}".`, 'success');
                return;
            }

            if (action === 'close-modal') {
                closeModal();
                return;
            }
        });

        // =====================================================================
        // 15. INISIALISASI SAAT HALAMAN SIAP
        // =====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            refreshIcons();
            initFirebaseAndData();
        });
    </script>
</body>
</html>
